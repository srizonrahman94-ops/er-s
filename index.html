<style>
/* =========================================================
   💗 HEART GALAXY
   ========================================================= */

#heartGalaxy {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  pointer-events: none;
  z-index: 0;
}

/* Individual hearts */
.galaxy-heart {
  position: absolute;
  left: 50%;
  top: 50%;

  color: #fff;
  font-size: 15px;

  opacity: 0;

  text-shadow:
    0 0 5px rgba(255,255,255,.9),
    0 0 12px rgba(255,120,220,.8),
    0 0 25px rgba(255,80,180,.6);

  animation:
    galaxyFloat var(--duration) ease-in-out infinite,
    heartTwinkle var(--twinkle) ease-in-out infinite;

  animation-delay: var(--delay);

  transform:
    translate(
      var(--x),
      var(--y)
    )
    scale(var(--scale));

  will-change:
    transform,
    opacity;
}


/* Some hearts are pink */
.galaxy-heart.pink {
  color: #ff9bd8;

  text-shadow:
    0 0 5px #fff,
    0 0 15px #ff70c8,
    0 0 30px #ff2fa7;
}


/* Some hearts are soft blue */
.galaxy-heart.blue {
  color: #b9efff;

  text-shadow:
    0 0 5px #fff,
    0 0 15px #68dfff,
    0 0 30px #42bfff;
}


/* Large foreground hearts */
.galaxy-heart.big {
  font-size: 28px;
}


/* Tiny distant stars/hearts */
.galaxy-heart.small {
  font-size: 8px;
  opacity: .5;
}


/* =========================================================
   🌌 GALAXY MOTION
   ========================================================= */

@keyframes galaxyFloat {

  0% {
    opacity: 0;

    transform:
      translate(
        var(--x),
        var(--y)
      )
      scale(.2)
      rotate(-20deg);
  }

  15% {
    opacity: var(--opacity);
  }

  50% {

    transform:
      translate(
        calc(var(--x) + var(--moveX)),
        calc(var(--y) + var(--moveY))
      )
      scale(var(--scale))
      rotate(15deg);
  }

  85% {
    opacity: var(--opacity);
  }

  100% {
    opacity: 0;

    transform:
      translate(
        calc(var(--x) - var(--moveX)),
        calc(var(--y) - var(--moveY))
      )
      scale(.3)
      rotate(-15deg);
  }
}


/* =========================================================
   ✨ HEART TWINKLE
   ========================================================= */

@keyframes heartTwinkle {

  0%,
  100% {
    filter: brightness(.7);
  }

  50% {
    filter: brightness(1.8);
  }
}


/* =========================================================
   💫 CENTER GALAXY GLOW
   ========================================================= */

#heartGalaxy::before {

  content: "";

  position: absolute;

  left: 50%;
  top: 50%;

  width: 250px;
  height: 250px;

  transform: translate(-50%, -50%);

  border-radius: 50%;

  background:
    radial-gradient(
      circle,
      rgba(255,150,220,.16),
      rgba(255,70,180,.06),
      transparent 70%
    );

  filter: blur(20px);

  animation:
    galaxyPulse 5s ease-in-out infinite;
}


@keyframes galaxyPulse {

  0%,
  100% {
    transform:
      translate(-50%, -50%)
      scale(.8);

    opacity: .5;
  }

  50% {
    transform:
      translate(-50%, -50%)
      scale(1.3);

    opacity: 1;
  }
}


/* =========================================================
   📱 MOBILE OPTIMIZATION
   ========================================================= */

@media (max-width: 600px) {

  .galaxy-heart {
    font-size: 12px;
  }

  .galaxy-heart.big {
    font-size: 22px;
  }

  #heartGalaxy::before {
    width: 180px;
    height: 180px;
  }
}
</style>


<script>
/* =========================================================
   💗 CREATE HEART GALAXY
   ========================================================= */

(function createHeartGalaxy() {

  /* Create galaxy container */

  const galaxy = document.createElement("div");

  galaxy.id = "heartGalaxy";

  document.body.prepend(galaxy);


  /* Heart types */

  const hearts = [
    "♡",
    "♥",
    "❤",
    "💗",
    "💖",
    "💕",
    "💓",
    "✦"
  ];


  /* Create 85 floating hearts */

  for (let i = 0; i < 85; i++) {

    const heart = document.createElement("span");

    heart.className = "galaxy-heart";


    /* Random heart */

    heart.innerHTML =
      hearts[
        Math.floor(
          Math.random() * hearts.length
        )
      ];


    /* Random position */

    const x =
      (Math.random() * 100 - 50) + "vw";

    const y =
      (Math.random() * 100 - 50) + "vh";


    /* Random movement */

    const moveX =
      (Math.random() * 80 - 40) + "px";

    const moveY =
      (Math.random() * 80 - 40) + "px";


    /* Random scale */

    const scale =
      (0.35 + Math.random() * 1.4).toFixed(2);


    /* Random opacity */

    const opacity =
      (0.25 + Math.random() * .75).toFixed(2);


    /* Random animation */

    const duration =
      (7 + Math.random() * 12).toFixed(2) + "s";

    const twinkle =
      (2 + Math.random() * 4).toFixed(2) + "s";

    const delay =
      (-Math.random() * 15).toFixed(2) + "s";


    /* Apply variables */

    heart.style.setProperty("--x", x);

    heart.style.setProperty("--y", y);

    heart.style.setProperty("--moveX", moveX);

    heart.style.setProperty("--moveY", moveY);

    heart.style.setProperty("--scale", scale);

    heart.style.setProperty("--opacity", opacity);

    heart.style.setProperty("--duration", duration);

    heart.style.setProperty("--twinkle", twinkle);

    heart.style.setProperty("--delay", delay);


    /* Random color */

    const colorRandom =
      Math.random();

    if (colorRandom < .18) {

      heart.classList.add("blue");

    } else if (colorRandom < .48) {

      heart.classList.add("pink");

    }


    /* Random size */

    if (Math.random() < .12) {

      heart.classList.add("big");

    }

    if (Math.random() < .18) {

      heart.classList.add("small");

    }


    galaxy.appendChild(heart);
  }

})();
</script>
